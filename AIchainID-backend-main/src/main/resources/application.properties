# ===================================================================
# AI-ChainID Backend Configuration
# ===================================================================
spring.application.name=aichainid-backend
server.port=8080

# Active Profile
spring.profiles.active=dev

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/AIchinId?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Security & JWT Configuration
# Base64 encoded secret key (minimum 256-bit for HS256 / HS384 / HS512)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# Python AI Microservice URL
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Static Frontend Resources (HTML pages served from resources/static/)
spring.web.resources.static-locations=classpath:/static/

# Initial Admin Configuration for Data Seeding
app.init.admin.email=admin@aichainid.org
app.init.admin.password=Admin@12345
app.init.admin.first-name=System
app.init.admin.last-name=Administrator

# Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Jackson Date Formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
